<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block document_title %}{% if page_title and page_title != "mc-admin" %}{{ page_title }} · {% endif %}mc-admin{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=20260720-term2">
  <script>try{var t=localStorage.getItem("mc-theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
  <a class="skip-link" href="#main-content">Aller au contenu principal</a>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
