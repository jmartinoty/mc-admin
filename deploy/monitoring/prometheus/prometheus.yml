# Config Prometheus — scrape des exporters de la stack monitoring.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: minecraft
    static_configs:
      - targets: ["mc-monitor:8080"]

  # TPS/MSPT réels, via le mod FabricExporter (s'appuie sur spark) côté serveur.
  - job_name: minecraft_exporter
    static_configs:
      - targets: ["minecraft:25585"]
